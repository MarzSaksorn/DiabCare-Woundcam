# WoundCam edge — PLACEHOLDER (B1).
# Chain: Cloudflare (TLS, rate limit, origin hiding, NFR-SEC-1)
#        → this Nginx → api container.
# Real vhost hardening (rate-limit zones, body-size guards, access logs)
# lands with B6/B8 once routes exist.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream woundcam_api {
        server api:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Binaries bypass this server entirely (FR-UPL-1): only JSON
        # API traffic is proxied. Keep request bodies small.
        client_max_body_size 64k;

        location / {
            proxy_pass http://woundcam_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection        "";
            proxy_pass_request_headers on;
        }
    }
}
