services:
  diabcare-woundcam-demo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DEMO_MODE: "true"
    image: diabcare-woundcam:public-demo
    ports:
      # Keep the origin private on the host. Cloudflare Tunnel connects over the Compose network.
      - "127.0.0.1:${PUBLIC_DEMO_PORT:-3301}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_DEMO_MODE: "true"
      SQLITE_DB_PATH: /data/diabcare-demo.sqlite
    volumes:
      - public-demo-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      diabcare-woundcam-demo:
        condition: service_healthy
    profiles:
      - cloudflare-tunnel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  public-demo-data:
