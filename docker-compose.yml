services:
  diabcare-woundcam:
    build:
      context: .
      dockerfile: Dockerfile
    image: diabcare-woundcam:local
    ports:
      - "${DIABCARE_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Set LOCAL_AUTH_BYPASS=true only for an isolated local demo.
      LOCAL_AUTH_BYPASS: ${LOCAL_AUTH_BYPASS:-false}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000)).then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
