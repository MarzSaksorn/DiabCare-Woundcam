# DiabCare WoundCam — git-cliff changelog config
# Generated by diab-log (changelog automation)
# See docs/release-process.md for workflow

[changelog]
header = "# Changelog\n\nAll notable changes to DiabCare WoundCam are documented here.\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} _({{ commit.scope }})_{% endif %}
{%- if commit.breaking %} **BREAKING**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
postprocess = [
  { replace = "BREAKING", with = "⚠️  BREAKING" },
]
footer = """
<!-- generated by diab-log/git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

[[git.commit_preprocessors]]
pattern = "\\.$"
replace = ""

[[git.groups]]
name = "⚠️  Breaking Changes"
breaking = true

[[git.groups]]
name = "Features"
matches = ["feat", "feature"]

[[git.groups]]
name = "Bug Fixes"
matches = ["fix"]

[[git.groups]]
name = "Documentation"
matches = ["docs"]

[[git.groups]]
name = "Performance"
matches = ["perf"]

[[git.groups]]
name = "Refactoring"
matches = ["refactor"]

[[git.groups]]
name = "Testing"
matches = ["test"]

[[git.groups]]
name = "CI/CD"
matches = ["ci"]

[[git.groups]]
name = "Chore"
matches = ["chore"]

[git.parsing]
message = "^((?P<type>\\w+)(?:\\((?P<scope>[^)]+)\\))?(?P<breaking>!)?:)?\\s*(?P<message>.*)"