services:
  diabcare-woundcam:
    image: ghcr.io/marzsaksorn/diabcare-woundcam:${DIABCARE_IMAGE_TAG:-latest}
    pull_policy: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOCAL_AUTH_BYPASS: "false"
      DISABLE_LOGIN_PAGE: "false"
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in Coolify}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in Coolify}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set SUPABASE_DATABASE_URL in Coolify}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      ENABLE_AZH_CLASSIFIER: ${ENABLE_AZH_CLASSIFIER:-true}
      WOUND_SEGMENTATION_ENABLED: ${WOUND_SEGMENTATION_ENABLED:-false}
      WOUND_SEGMENTATION_THRESHOLD: ${WOUND_SEGMENTATION_THRESHOLD:-0.5}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-diabcare-woundcam}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000)).then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
